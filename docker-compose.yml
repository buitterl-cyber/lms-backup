# Local development dependencies for RiyadaIntel. Production runs these on managed services
# (RDS/Aurora, ElastiCache, Amazon MQ, managed Meilisearch, ClickHouse Cloud) — see infra/.
version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: riyada
      POSTGRES_PASSWORD: riyada
      POSTGRES_DB: riyada
    ports: ["5440:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6390:6379"]

  meilisearch:
    image: getmeili/meilisearch:v1.8
    environment:
      MEILI_MASTER_KEY: devmasterkey
    ports: ["7700:7700"]

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports: ["8123:8123", "9000:9000"]
    volumes: ["ch:/var/lib/clickhouse"]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]

volumes:
  pg:
  ch:
